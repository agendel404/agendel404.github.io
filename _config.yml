# ─────────────────────────────────────────────
# Site settings: edit these once.
# After editing this file, GitHub rebuilds the site automatically.
# ─────────────────────────────────────────────
title: Andrew Gendel
tagline: Design systems and AI-ready documentation
description: >-
  Andrew Gendel is a product designer who builds design systems that work for
  both people and AI agents: documentation, standards, naming, and governance.
url: "https://agendel404.github.io"   # change to "https://agendeldesign.com" if you add the custom domain later
baseurl: ""
lang: en

author:
  name: Andrew Gendel   # used for search/link previews. Contact details live in _data/profile.yml

# ─── Case studies live in /_case_studies as Markdown files ───
collections:
  case_studies:
    output: true
    permalink: /work/:name/

defaults:
  - scope: { path: "", type: case_studies }
    values: { layout: case-study }
  - scope: { path: "" }
    values: { layout: page }

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  hard_wrap: false
  smart_quotes: ["apos", "apos", "quot", "quot"]

plugins:
  - jekyll-sitemap

# Default social-preview image (1200×630). Case studies use /assets/img/og/<slug>.jpg.
og_image: /assets/img/og/home.jpg

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github
  - scripts
